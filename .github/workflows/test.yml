name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install ruff
      run: pip install ruff

    - name: Run ruff
      run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install . && pip install ".[dev,all]"

    - name: Verify installation
      run: |
        python -c "import picobot; print('picobot version:', picobot.__version__)"

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short

  bare-install:
    # Guards the README Quick Start path (`pip install picobot`, no extras):
    # a base install must be able to import every channel it registers by
    # default. This is what would have caught the missing `websockets`
    # dependency before it shipped.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install picobot with no extras
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Import every default-registered channel
      run: |
        python -c "
        import picobot
        from picobot.channels.web import WebChannel
        from picobot.channels.discord import DiscordChannel
        print('bare install OK:', picobot.__version__)
        "
