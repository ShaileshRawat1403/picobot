<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pico Browser Bridge</title>
  <style>
    body { width:320px; margin:0; padding:18px; background:#f7f8fa; color:#20242b; font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    h1 { margin:0 0 7px; font-size:15px; } p { color:#67707b; } input,button { box-sizing:border-box; width:100%; font:inherit; } input { margin:8px 0; border:1px solid #d4dbe5; border-radius:4px; padding:9px; } button { border:1px solid #315a9e; border-radius:4px; padding:9px; background:#315a9e; color:#fff; font-weight:650; } button.secondary { margin-top:8px; border-color:#d4dbe5; background:#fff; color:#315a9e; } button:disabled { opacity:.55; } #status { min-height:35px; margin-top:10px; color:#66717d; font-size:12px; } .note { margin-top:14px; padding-top:12px; border-top:1px solid #e1e5ea; color:#7d858f; font-size:11px; }
  </style>
</head>
<body>
  <h1>Pico Browser Bridge</h1>
  <p>Share only this current tab with one Pico session. It cannot see your other tabs, history, cookies, or passwords.</p>
  <label for="pairing-code">Pico session code</label>
  <input id="pairing-code" autocomplete="off" spellcheck="false" placeholder="Paste code from Pico Operations">
  <button id="share">Share current tab</button>
  <button class="secondary" id="refresh" hidden>Refresh shared snapshot</button>
  <div id="status" role="status"></div>
  <div class="note">Pico blocks sensitive login, password, recovery, payment, checkout, and billing paths. To stop sharing, revoke it in Pico Operations.</div>
  <script src="popup.js"></script>
</body>
</html>
